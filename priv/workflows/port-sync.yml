name: port-sync
description: Sync port with upstream changes
version: "1.0"

steps:
  - name: check_clean
    description: Ensure working directory is clean
    git:
      command: status

  - name: fetch_upstream
    description: Fetch latest from origin
    git:
      command: fetch
      args: ["--all"]

  - name: check_diff
    description: Check differences with upstream
    git:
      command: diff
      args: ["origin/main", "--stat"]

  - name: pull_changes
    description: Pull latest changes
    git:
      command: pull
    continue_on_error: true

  - name: record_sync
    description: Record sync in portfolio
    update:
      note: "Synced with upstream on {{env.PWD}}"
