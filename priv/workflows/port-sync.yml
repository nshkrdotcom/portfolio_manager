schema_version: 1

workflow:
  id: port-sync
  name: "Port Sync"
  description: "Synchronize port with upstream changes"
  version: 1.0.0

  target: repo
  target_filter:
    type: port

  inputs:
    repo_id:
      type: string
      required: true

    mode:
      type: enum
      values: [draft, apply]
      default: draft

  steps:
    - id: check
      type: workflow
      action: run
      inputs:
        workflow: port-check
        repo_id: $inputs.repo_id
      outputs:
        result: check_result

    - id: update_manifest
      type: update
      action: update_context
      inputs:
        repo_id: $inputs.repo_id
        updates:
          port:
            sync:
              last_date: $now

  outputs:
    check: $check_result
