schema_version: 1

workflow:
  id: port-check
  name: "Port Check"
  description: "Check port status against upstream"
  version: 1.0.0

  target: repo
  target_filter:
    type: port

  inputs:
    repo_id:
      type: string
      required: true

  steps:
    - id: get_context
      type: context
      action: get_repo_context
      inputs:
        repo_id: $inputs.repo_id
      outputs:
        context: repo_context

    - id: validate_port
      type: control
      action: condition
      inputs:
        condition: "$repo_context.type == \"port\""
        on_false: abort
        abort_message: "Repo is not a port"

    - id: fetch_upstream
      type: git
      action: fetch
      inputs:
        url: $repo_context.port.upstream_url

    - id: compare
      type: git
      action: diff
      inputs:
        base: $repo_context.port.sync.last_commit
        head: HEAD
      outputs:
        diff: diff_info

    - id: update_status
      type: update
      action: update_context
      inputs:
        repo_id: $inputs.repo_id
        updates:
          computed:
            commit_count_30d: $diff_info.commit_count

  outputs:
    report:
      commits_behind: $diff_info.commit_count
