schema_version: 1

workflow:
  id: health-check
  name: "Portfolio Health Check"
  description: "Analyze health of all tracked repos"
  version: 1.0.0

  target: portfolio

  inputs:
    scope:
      type: enum
      values: [all, active, stale]
      default: all

  steps:
    - id: get_all_repos
      type: context
      action: get_portfolio_context
      outputs:
        repos: portfolio_context

    - id: generate_report
      type: agent
      action: generate
      provider: claude
      inputs:
        prompt: |
          Generate a portfolio health report.

          Repos: {{portfolio_context.repos}}
          Relationships: {{portfolio_context.relationships}}
      outputs:
        output: report

  outputs:
    report: $report
