schema_version: 1

workflow:
  id: doc-generate
  name: "Documentation Generation"
  description: "Generate or update repository documentation"
  version: 1.0.0

  target: repo

  inputs:
    repo_id:
      type: string
      required: true

    doc_types:
      type: array
      default: [readme, architecture]

  steps:
    - id: get_context
      type: context
      action: get_related_context
      inputs:
        repo_id: $inputs.repo_id
        depth: 1
      outputs:
        context: full_context

    - id: read_existing_docs
      type: file
      action: read
      inputs:
        path: $portfolio_path/repos/$inputs.repo_id/
        patterns: ["*.md"]
      outputs:
        files: existing_docs

    - id: generate_docs
      type: agent
      action: generate
      provider: claude
      inputs:
        prompt: |
          Generate documentation for this project.

          Project: {{full_context.repo.name}}
          Purpose: {{full_context.repo.purpose}}
          Existing docs: {{existing_docs}}
      outputs:
        output: generated_docs

    - id: write_docs
      type: file
      action: write
      inputs:
        path: $portfolio_path/repos/$inputs.repo_id/
        files: $generated_docs

    - id: update_context
      type: update
      action: update_context
      inputs:
        repo_id: $inputs.repo_id
        updates:
          computed:
            docs_updated_at: $now

  outputs:
    docs: $generated_docs
