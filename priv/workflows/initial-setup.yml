schema_version: 1

workflow:
  id: initial-setup
  name: "Initial Setup"
  description: "Scan and configure portfolio for existing repos"
  version: 1.0.0

  target: portfolio

  inputs:
    directories:
      type: array
      required: true

    agentic_detection:
      type: boolean
      default: true

  steps:
    - id: scan
      type: file
      action: find_git_repos
      inputs:
        directories: $inputs.directories
        exclude: ["node_modules", "deps", "_build", "vendor"]
      outputs:
        repos: discovered_repos

    - id: detect_basic
      type: control
      action: loop
      inputs:
        items: $discovered_repos
        step:
          id: basic_detect
          type: detection
          action: deterministic
          inputs:
            path: $item.path
      outputs:
        results: basic_detections

    - id: detect_agentic
      type: control
      action: condition
      inputs:
        condition: $inputs.agentic_detection == true
        on_true:
          - id: agentic_detect
            type: control
            action: loop
            inputs:
              items: $basic_detections
              step:
                id: agent_detect
                type: detection
                action: agentic
                inputs:
                  repo: $item
      outputs:
        results: agentic_detections

  outputs:
    repos: $discovered_repos
