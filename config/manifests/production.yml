version: "1.0"
environment: production

adapters:
  vector_store:
    adapter: PortfolioIndex.Adapters.VectorStore.Pgvector
    config:
      repo: PortfolioManager.Repo
      index_type: ivfflat
      lists: 200

  graph_store:
    adapter: PortfolioIndex.Adapters.GraphStore.Neo4j
    config:
      uri: ${NEO4J_URI}
      username: ${NEO4J_USER}
      password: ${NEO4J_PASSWORD}
      pool_size: 10

  embedder:
    adapter: PortfolioIndex.Adapters.Embedder.Gemini
    config:
      model: gemini-embedding-001
      dimensions: 768

  llm:
    adapter: PortfolioIndex.Adapters.LLM.Gemini
    config:
      model: gemini-flash-lite-latest
      max_tokens: 4096

  chunker:
    adapter: PortfolioIndex.Adapters.Chunker.Recursive
    config:
      chunk_size: 1000
      chunk_overlap: 200

router:
  strategy: specialist
  health_check_interval: 30000
  providers:
    - name: gemini
      module: PortfolioIndex.Adapters.LLM.Gemini
      config:
        model: gemini-flash-lite-latest
      capabilities:
        - generation
        - code
        - reasoning
      priority: 1

    - name: claude
      module: PortfolioIndex.Adapters.LLM.Anthropic
      config: {}
      capabilities:
        - reasoning
        - analysis
      priority: 2

    # Uses OpenAI adapter (openai_ex); defaults to gpt-4o-mini unless overridden
    - name: openai
      module: PortfolioIndex.Adapters.LLM.OpenAI
      config: {}
      capabilities:
        - generation
        - code
      priority: 3

agent:
  max_iterations: 10
  timeout: 300000
  tools:
    - search_code
    - read_file
    - list_files
    - get_graph_context

pipelines:
  ingestion:
    enabled: true
    concurrency: 20
    batch_size: 100

  embedding:
    enabled: true
    concurrency: 10
    rate_limit: 200

graphs:
  default:
    id: default
    type: knowledge
    config:
      community_detection: true

rag:
  default_strategy: hybrid
  strategies:
    hybrid:
      vector_weight: 0.7
      keyword_weight: 0.3
    self_rag:
      critique_threshold: 3

telemetry:
  enabled: true
  exporters:
    - console
