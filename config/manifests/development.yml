version: "1.0"
environment: development

adapters:
  vector_store:
    adapter: PortfolioIndex.Adapters.VectorStore.Pgvector
    config:
      repo: PortfolioManager.Repo
      index_type: ivfflat
      lists: 100

  graph_store:
    adapter: PortfolioIndex.Adapters.GraphStore.Neo4j
    config:
      uri: ${NEO4J_URI:-bolt://localhost:7687}
      username: ${NEO4J_USER:-neo4j}
      password: ${NEO4J_PASSWORD:-password}
      pool_size: 5

  embedder:
    adapter: PortfolioIndex.Adapters.Embedder.Gemini
    config:
      model: gemini-embedding-001
      dimensions: 768

  llm:
    adapter: PortfolioIndex.Adapters.LLM.Gemini
    config:
      model: gemini-flash-lite-latest
      max_tokens: 4096

  chunker:
    adapter: PortfolioIndex.Adapters.Chunker.Recursive
    config:
      chunk_size: 1000
      chunk_overlap: 200

router:
  strategy: fallback
  health_check_interval: 30000
  providers:
    - name: gemini_fast
      config:
        model: gemini-flash-lite-latest
      capabilities:
        - generation
        - code
      priority: 1

    - name: gemini_reasoning
      config:
        model: gemini-1.5-pro-latest
      capabilities:
        - reasoning
        - analysis
      priority: 2

agent:
  max_iterations: 10
  timeout: 300000
  tools:
    - search_code
    - read_file
    - list_files
    - get_graph_context

pipelines:
  ingestion:
    enabled: true
    concurrency: 10
    batch_size: 50

  embedding:
    enabled: true
    concurrency: 5
    rate_limit: 100

graphs:
  default:
    id: default
    type: knowledge
    config:
      community_detection: false

  code:
    id: code
    type: dependency
    config:
      languages: [elixir, python, javascript]

rag:
  default_strategy: hybrid
  strategies:
    hybrid:
      vector_weight: 0.7
      keyword_weight: 0.3
    self_rag:
      critique_threshold: 3

telemetry:
  enabled: true
  exporters:
    - console
