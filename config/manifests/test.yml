version: "1.0"
environment: test

adapters:
  vector_store:
    adapter: PortfolioManager.Mocks.VectorStore
    config: {}

  graph_store:
    adapter: PortfolioManager.Mocks.GraphStore
    config: {}

  embedder:
    adapter: PortfolioManager.Mocks.Embedder
    config: {}

  llm:
    adapter: PortfolioManager.Mocks.LLM
    config: {}

  chunker:
    adapter: PortfolioManager.Mocks.Chunker
    config: {}

router:
  strategy: fallback
  health_check_interval: 0
  providers:
    - name: test_llm
      config: {}
      capabilities:
        - generation
        - reasoning
        - code
      priority: 1

agent:
  max_iterations: 5
  timeout: 30000
  tools:
    - search_code
    - read_file
    - list_files
    - get_graph_context

pipelines:
  ingestion:
    enabled: false

  embedding:
    enabled: false

telemetry:
  enabled: false
